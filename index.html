<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Social links profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrapper">
    <div class="user-profile">
      <img src="./assets/images/avatar-jessica.jpeg" alt="user" class="user-image"/>

      <h1 class="user-name">Jessica Randall</h1>

      <p class="user-location">London, United Kingdom</p>

      <p class="user-qoute">"Front-end developer and avid reader."</p>
    <ul class="Social-Link">
      <li><a href="#" class="Social-Card">GitHub</a></li>
      <li><a href="#" class="Social-Card">Frontend Mentor</a></li>
      <li><a href="#" class="Social-Card">LinkedIn</a></li>
      <li><a href="#" class="Social-Card">Twitter</a></li>
      <li><a href="#" class="Social-Card">Instagram</a></li>
    </ul>
    </div>
  </main>
</body>
</html>
